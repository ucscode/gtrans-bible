import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ucscode.gtransbible'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.ucscode.gtransbible.dev'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        debug.assets.srcDir "$buildDir/generated/localBibleAssets/debug"
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

def requiredLocalDatabases = ['bible.sqlite', 'igbob-modern.sqlite', 'kjv.sqlite']
def localDataRoot = rootProject.layout.projectDirectory.dir('../data')
def stagingOutput = layout.buildDirectory.dir('generated/localBibleAssets/debug')

tasks.register('prepareLocalBibleData') {
    group = 'local development data'
    description = 'Validates and stages the three local Bible SQLite files into debug-only assets.'
    inputs.file(localDataRoot.file('generated/database-manifest.json'))
    requiredLocalDatabases.each { filename -> inputs.file(localDataRoot.file("databases/${filename}")) }
    outputs.dir(stagingOutput)

    doLast {
        File manifestFile = localDataRoot.file('generated/database-manifest.json').asFile
        File databaseDir = localDataRoot.file('databases').asFile
        if (!manifestFile.isFile()) {
            throw new GradleException("Missing ${manifestFile}. Rebuild the local Bible databases first.")
        }
        def manifest = new JsonSlurper().parse(manifestFile)
        File outputDir = stagingOutput.get().asFile
        File stagedDatabaseDir = new File(outputDir, 'databases')
        stagedDatabaseDir.mkdirs()
        def staged = []

        requiredLocalDatabases.each { filename ->
            File source = new File(databaseDir, filename)
            if (!source.isFile()) {
                throw new GradleException("Missing local database ${source}. Restore/rebuild local Bible data; no network download is performed.")
            }
            def entry = manifest.databases.find { it.filename == filename }
            if (entry == null || !(entry.sha256 ==~ /[0-9a-f]{64}/)) {
                throw new GradleException("Manifest has no valid SHA-256 entry for ${filename}: ${manifestFile}")
            }
            byte[] digest = MessageDigest.getInstance('SHA-256').digest(source.bytes)
            String actualHash = digest.collect { String.format('%02x', it & 0xff) }.join()
            if (actualHash != entry.sha256) {
                throw new GradleException("Hash mismatch for ${filename}. Regenerate the database manifest before building.")
            }
            File destination = new File(stagedDatabaseDir, filename)
            if (!destination.isFile() || destination.length() != source.length() ||
                    MessageDigest.getInstance('SHA-256').digest(destination.bytes).collect { String.format('%02x', it & 0xff) }.join() != actualHash) {
                destination.bytes = source.bytes
            }
            staged << [
                filename: filename,
                edition_id: entry.edition_id,
                version: entry.version,
                normalization_version: entry.normalization_version,
                sha256: actualHash,
            ]
        }

        new File(outputDir, 'database-manifest.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([manifest_version: 1, databases: staged]))
    }
}

tasks.matching { it.name == 'preDebugBuild' || it.name == 'mergeDebugAssets' }.configureEach {
    dependsOn tasks.named('prepareLocalBibleData')
}
